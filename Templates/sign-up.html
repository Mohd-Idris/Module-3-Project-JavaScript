  <main>

    <section class="sign-up">
      <div class="sign-up-container">
        <h1 class="sign-up-title"><span class="sign-up-span">S</span>ign <span class="sign-up-span">U</span>p</h1>
        <span id="error-message" class="error-message-input"></span>
        <span id="account-created" class="account-created"></span>
        <form class="sign-up-form" id="sign-up-form">



          <div class="sign-up-form-content">
            <label for="fullname-input" class="label lbl-fullname">Name
            </label>
            <input type="text" name="fullname" id="fullname-input" placeholder="Please enter your Full Name" />
          </div>

          <div class="sign-up-form-content">
            <label for="email-input" class="label lbl-email">Email
            </label>
            <input type="email" name="email" id="email-input" placeholder="Please enter your Email " />
          </div>

          <div class="sign-up-form-content">
            <label for="password-input" class="label lbl-password"> password
            </label>
            <input type="password" name="password" id="password-input" placeholder="Please enter your password " />
          </div>

          <div class="sign-up-form-content">
            <label for="confirm-password-input" class="label lbl-confirm-password">Confirm password
            </label>
            <input type="password" name="confirm-password" id="confirm-password-input"
              placeholder="Please confirm your password " />
          </div>

          <button type="submit" class="btn-sign-up" id="btnSignUp">Sign up</button>
          <p>Already registered <a href="./login.html" class="sign-up-link">login</a></p>
        </form>
      </div>
    </section>
