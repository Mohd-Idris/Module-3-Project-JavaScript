<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My JS Project</title>
    <!-- An external link CSS style  -->
    <link rel="stylesheet" href="./style.css" />
    <!-- Fonts -->
    <!-- An external font (Poppins font) for the website -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Icons -->
    <!-- A link to generate icons for the website -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <!-- Navigation Links Section -->
    <header>
      <div class="hearder-container container">
        <div class="logo">
          <a
            href="index.html"
            aria-label="Website logo"
            aria-labelledby="Website logo"
            >My<span class="header-span span">JSPro</span></a
          >
        </div>
        <div class="nav-div">
          <nav class="nav-bar">
            <ul class="nav-links">
              <li>
                <a
                  href="index.html"
                  aria-label="Home link"
                  aria-labelledby="Home link"
                  >Home</a
                >
              </li>
              <li>
                <a
                  href="todo-page.html"
                  id="application-link"
                  aria-label="Application link"
                  aria-labelledby="Application link"
                  >Application</a
                >
              </li>
              <li>
                <a
                  href="contact-me.html"
                  aria-label="Contact me link"
                  aria-labelledby="Contact me link"
                  >Contact Me</a
                >
              </li>
              <li>
                <a
                  href="sign-up.html"
                  aria-label="Sign up link"
                  aria-labelledby="Sign up link"
                  >Sign Up</a
                >
              </li>
              <li>
                <a
                  href="login.html"
                  class="active-page"
                  aria-label="Login link"
                  aria-labelledby="Login link"
                  >Login</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <!-- Main Section-->
    <main>
      <section class="login">
        <div class="login-container">
          <h1 class="login-title"><span class="login-span">L</span>ogin</h1>
          <span id="error-message" class="error-message-input"></span>
          <span id="login-message" class="login-message-input"></span>
          <form id="login-form" class="login-form">
            <div class="login-form-content">
              <label class="label lbl-email">Email </label>
              <input
                type="email"
                name="email"
                id="email-input"
                placeholder="Please Enter your Email"
              />
            </div>

            <div class="login-form-content">
              <label class="label lbl-password">Password </label>
              <input
                type="password"
                name="password"
                id="password-input"
                placeholder="Please enter your password "
              />
            </div>

            <button type="submit" class="submit btn-login">Login</button>
          </form>
          <p>
            Don't you have account?
            <a href="sign-up.html" class="login-link">Create account</a>
          </p>
        </div>
      </section>
    </main>

    <!-- Footer Section-->
    <footer>
      <div class="container">
        <p>&copy; 2026 MyJSPro | All rights reserved</p>

        <div class="social-icons">
          <a
            href="https://youtube.com"
            target="_blank"
            aria-label="Youtube Website"
          >
            <i class="fa-brands fa-youtube you-red"></i
          ></a>

          <a
            href="https://linkedin.com"
            target="_blank"
            aria-label="LinkedIN Website"
          >
            <i class="fa-brands fa-linkedin link-blue"></i
          ></a>

          <a href="https://x.com" target="_blank" aria-label="X Website ">
            <i class="fa-brands fa-x-twitter x-black"></i
          ></a>

          <a
            href="https://github.com"
            target="_blank"
            aria-label="GitHub Website"
          >
            <i class="fa-brands fa-github git-black"></i
          ></a>
        </div>
      </div>
    </footer>

    <script src="./welcome-message.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
